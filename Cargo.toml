[package]
name = "hocon-rs"
version = "0.2.0"
edition = "2024"
authors = ["mikai233 <dreamfever2017@yahoo.com>"]
description = "Rust implementation of HOCON"
repository = "https://github.com/mikai233/hocon-rs"
homepage = "https://github.com/mikai233/hocon-rs"
documentation = "https://docs.rs/hocon-rs"
keywords = ["hocon", "configuration"]
license = "MIT"
readme = "README.md"

[workspace]
members = ["fuzz"]

[dependencies]
memchr = "2.8.3"
thiserror = "2.0.20"
serde = { version = "1.0.229" }
serde_json = { version = "1.0.151" }
reqwest = { version = "0.13.4", optional = true, default-features = false, features = [
    "blocking",
    "rustls",
] }
url = "2.5.8"
java-properties = { version = "2.0.0", optional = true }
derive_more = { version = "2.1.1", features = [
    "deref",
    "deref_mut",
    "constructor",
] }
tracing = "0.1.44"
num-bigint = "0.5.1"
bigdecimal = "0.4.10"

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["local-time"] }
ctor = "1.0.13"
serde = { version = "1.0.229", features = ["derive"] }
rstest = "0.26.1"
criterion = "0.8.2"

[[bench]]
name = "parser_bench"
harness = false

[features]
default = []
properties = ["dep:java-properties"]
urls_includes = ["dep:reqwest"]
json_arbitrary_precision = ["serde_json/arbitrary_precision"]
